name: Stage beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          git merge-base --is-ancestor HEAD origin/main
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          experimental: true
      - run: mise run setup
      - run: mise run lint
      - run: mise run test
      - run: mise run build
      - run: |
          cd tmp
          sha256sum *.tgz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: beta-release-candidate
          path: |
            tmp/*.tgz
            tmp/SHA256SUMS
            tmp/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 7
