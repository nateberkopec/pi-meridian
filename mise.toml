[env]
_.file = ".env"

[tools]
node = "26.10.0"
"github:aubepkg/aube" = "2.6.1"
"npm:typescript" = "7.0.2"
"npm:@earendil-works/pi-coding-agent" = "1.3.0"
hk = "2.4.0"
gitleaks = "8.30.1"

[tasks.setup]
run = "bash tools/setup-development.sh"

[tasks.lint]
depends = ["lint:javascript", "lint:secrets"]

[tasks."lint:javascript"]
sources = ["test/**", "tools/**", "package.json", "development/package.json", "development/aube-lock.yaml"]
run = "node_modules/.bin/oxlint --deny-warnings test tools && node_modules/.bin/oxfmt --check test tools"

[tasks."lint:secrets"]
run = "gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 ."

[tasks.test]
depends = ["test:package", "test:types"]

[tasks."test:package"]
sources = ["extensions/**", "test/**", "package.json", "development/package.json", "development/aube-lock.yaml", "LICENSE", "README.md", "UPSTREAM"]
run = "node --test test/package_system_test.mjs"

[tasks."test:types"]
sources = ["extensions/**", "tsconfig.json", "package.json", "development/package.json", "development/aube-lock.yaml"]
run = "tsc --project tsconfig.json"

[tasks.build]
run = "mkdir -p tmp && npm pack --ignore-scripts --pack-destination tmp"

[tasks.format]
run = "node_modules/.bin/oxfmt test tools package.json tsconfig.json"
